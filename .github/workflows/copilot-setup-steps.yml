name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: windows-2022
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Show Windows toolchain details
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion
          Get-Command msbuild -ErrorAction SilentlyContinue | Format-List

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          msbuild .\microsoft\OpenConsole.slnx /restore /t:ValidateSolutionConfiguration /m /p:Configuration=Debug /p:Platform=x64
          nuget restore .\microsoft\dep\nuget\packages.config -Verbosity quiet

      - name: Detect VS vcpkg or bootstrap locally
        shell: pwsh
        run: |
          $VsInstallRoot = & 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe' -requires Microsoft.VisualStudio.Component.Vcpkg -property installationPath
          if ([string]::IsNullOrEmpty($VsInstallRoot)) {
            Remove-Item -Recurse -Force .\microsoft\dep\vcpkg -ErrorAction Ignore
            git clone https://github.com/microsoft/vcpkg .\microsoft\dep\vcpkg
            Set-Location .\microsoft\dep\vcpkg
            .\bootstrap-vcpkg.bat
            $VcpkgRoot = (Get-Location).Path
            Write-Host "Using vcpkg from local checkout ($VcpkgRoot)"
          } else {
            $VcpkgRoot = Join-Path $VsInstallRoot 'VC\vcpkg'
            Write-Host "Using vcpkg from Visual Studio installation ($VcpkgRoot)"
          }
          "VCPKG_ROOT=$VcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Debug solution
        shell: cmd
        run: |
          call .\microsoft\tools\razzle.cmd dbg
          set _SKIP_NUGET_RESTORE=1
          bcz no_clean dbg
