name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: windows-2022
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Show Windows toolchain details
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion
          cmake --version
          ninja --version

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          nuget restore .\microsoft\dep\nuget\packages.config -Verbosity quiet

      - name: Guard the native CMake build graph
        shell: pwsh
        run: |
          $nativeBuildInputs = @(
            '.\CMakeLists.txt',
            '.\.github\workflows\copilot-setup-steps.yml',
            '.\microsoft\.vscode\tasks.json',
            '.\microsoft\tools\OpenConsole.psm1',
            ('.\microsoft\tools\b' + 'cz.cmd'),
            '.\microsoft\tools\bx.cmd',
            ('.\microsoft\tools\razz' + 'le.cmd'),
            '.\microsoft\src\tools\ColorTool\build.bat',
            '.\microsoft\src\tools\ColorTool\build.ps1'
          )
          $legacyBuildInvocation = @(
            ('MS' + 'Build\.exe'),
            ('\.vcx' + 'proj'),
            ('\.wap' + 'proj'),
            ('dotnet' + '\s+(build|publish|msbuild)'),
            ('\b(razz' + 'le|b' + 'cz)\b')
          ) -join '|'
          $violations = Select-String -Path $nativeBuildInputs -Pattern $legacyBuildInvocation -CaseSensitive:$false
          if ($violations) {
            $violations | Format-Table Path, LineNumber, Line -AutoSize | Out-String | Write-Error
            throw 'The native CMake/Ninja build graph must not invoke a legacy MSBuild entry point.'
          }

      - name: Detect VS vcpkg or bootstrap locally
        shell: pwsh
        run: |
          $VsInstallRoot = & 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe' -requires Microsoft.VisualStudio.Component.Vcpkg -property installationPath
          if ([string]::IsNullOrEmpty($VsInstallRoot)) {
            Remove-Item -Recurse -Force .\microsoft\dep\vcpkg -ErrorAction Ignore
            git clone https://github.com/microsoft/vcpkg .\microsoft\dep\vcpkg
            Set-Location .\microsoft\dep\vcpkg
            .\bootstrap-vcpkg.bat
            $VcpkgRoot = (Get-Location).Path
            Write-Host "Using vcpkg from local checkout ($VcpkgRoot)"
          } else {
            $VcpkgRoot = Join-Path $VsInstallRoot 'VC\vcpkg'
            Write-Host "Using vcpkg from Visual Studio installation ($VcpkgRoot)"
          }
          "VCPKG_ROOT=$VcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure and build Debug product
        shell: pwsh
        run: |
          cmake -S . -B .\build
          cmake --build .\build --config Debug
          cmake --build .\build --config Debug --target full
